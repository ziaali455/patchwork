[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchwork-cli"
version = "0.2.0"
description = "Model editors update local model weights from a plain-language goal, no training. Sparse, shareable patches with before/after benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["anthropic>=0.70,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
car = [
    "numpy>=1.26",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "kinetix-env @ git+https://github.com/FLAIROx/Kinetix.git@80ee9c292837c825cafaf9889323fdcc212efd1b",
]
breakout = ["numpy>=1.26", "minatar==1.0.15"]
local = [
    "huggingface-hub>=1.3,<2",
    "torch>=2.6,<3",
    "transformers>=5.3,<6",
    "safetensors>=0.4",
    "datasets>=3",
]

[project.scripts]
patchwork = "patchwork.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchwork"]

[tool.hatch.metadata]
allow-direct-references = true
